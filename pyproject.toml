[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-alpha"
version = "0.1.0"
description = "AI-powered equity trading agent for Indian markets via Zerodha Kite Connect"
requires-python = ">=3.9"
dependencies = [
    # Broker
    "kiteconnect>=5.0.1",

    # AI
    "anthropic>=0.40.0",

    # Config & Validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",

    # Data
    "pandas>=2.1.0",
    "numpy>=1.26.0",

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",

    # Scheduling
    "apscheduler>=3.10.0",

    # HTTP
    "httpx>=0.27.0",

    # Logging
    "structlog>=24.1.0",

    # News parsing
    "feedparser>=6.0.0",

    # Stats (for pairs trading, regime detection)
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "hmmlearn>=0.3.0",

    # Env
    "python-dotenv>=1.0.0",

    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
