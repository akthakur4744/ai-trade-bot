# Live trading overrides — stricter limits
execution:
  mode: "live"
  live:
    order_type: "MARKET"
    exchange: "NSE"
    product: "MIS"

# Tighter risk limits for live
risk:
  max_capital_per_trade: 5000
  max_daily_loss: 500
  max_open_positions: 2
  max_capital_deployed: 15000

database:
  # Set DATABASE_URL_LIVE to the Neon live DB URL.
  url: "${DATABASE_URL_LIVE}"

logging:
  level: "INFO"
