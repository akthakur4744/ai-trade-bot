# Paper trading overrides
execution:
  mode: "paper"
  paper:
    slippage_bps: 5
    fill_delay_ms: 100

database:
  # Set DATABASE_URL_PAPER to the Neon paper DB URL.
  # Falls back to local SQLite when the env var is unset (for offline dev).
  url: "${DATABASE_URL_PAPER}"

logging:
  level: "DEBUG"
