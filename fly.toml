app = "insight-alpha-auto-sell"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  EXECUTION_MODE = "paper"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"   # bumped from 256mb: scan background task + auto-sell loop can coexist
  cpus = 1

[processes]
  app = "python -m workers.main"

[http_service]
  internal_port = 8080
  force_https   = true
  auto_stop_machines  = false   # must stay running for 60s auto-sell loop
  auto_start_machines = false
  processes             = ["app"]

[deploy]
  strategy = "immediate"
