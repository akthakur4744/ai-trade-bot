<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insight-Alpha | Trading Dashboard</title>

    <!-- Design System -->
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/layout.css">

    <!-- Screen Styles -->
    <link rel="stylesheet" href="/static/css/screens/dashboard.css">
    <link rel="stylesheet" href="/static/css/screens/signals.css">
    <link rel="stylesheet" href="/static/css/screens/trades.css">
    <link rel="stylesheet" href="/static/css/screens/positions.css">
    <link rel="stylesheet" href="/static/css/screens/analytics.css">
    <link rel="stylesheet" href="/static/css/screens/watchlist.css">
    <link rel="stylesheet" href="/static/css/screens/settings.css">

    <!-- TradingView Lightweight Charts (CDN) -->
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <div class="app-shell">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <div>
                    <div class="logo">Insight-Alpha</div>
                    <div class="logo-sub">Trading Terminal</div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-label">Overview</div>
                    <a class="nav-item active" data-screen="dashboard" href="#/dashboard">
                        <span class="nav-icon">&#9635;</span>
                        Dashboard
                    </a>
                    <a class="nav-item" data-screen="signals" href="#/signals">
                        <span class="nav-icon">&#9783;</span>
                        Signal Pipeline
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-label">Trading</div>
                    <a class="nav-item" data-screen="positions" href="#/positions">
                        <span class="nav-icon">&#9679;</span>
                        Open Positions
                        <span class="nav-badge" id="nav-positions-count">0</span>
                    </a>
                    <a class="nav-item" data-screen="trades" href="#/trades">
                        <span class="nav-icon">&#8644;</span>
                        Trade History
                    </a>
                    <a class="nav-item" data-screen="watchlist" href="#/watchlist">
                        <span class="nav-icon">&#9733;</span>
                        Watchlist
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-label">Insights</div>
                    <a class="nav-item" data-screen="analytics" href="#/analytics">
                        <span class="nav-icon">&#9636;</span>
                        Analytics
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-label">System</div>
                    <a class="nav-item" data-screen="settings" href="#/settings">
                        <span class="nav-icon">&#9881;</span>
                        Settings
                    </a>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-status">
                    <span class="status-dot" id="sidebar-status-dot"></span>
                    <span id="sidebar-status-text">Disconnected</span>
                </div>
            </div>
        </aside>

        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Menu">&#9776;</button>
                <h2 class="header-page-title" id="page-title">Dashboard</h2>
                <span class="badge" id="mode-badge">PAPER</span>
            </div>

            <div class="header-right">
                <!-- Engine Controls -->
                <div class="header-controls" id="engine-controls">
                    {% if not state.is_authenticated %}
                    <a href="/auth/login" class="btn btn-primary btn-sm">Login with Zerodha</a>
                    {% else %}
                    <span class="header-status">
                        <span class="status-dot" id="header-status-dot"></span>
                        <span id="header-status-text">Ready</span>
                    </span>
                    <button class="btn btn-success btn-sm" id="btn-start" onclick="window.__engine.start()">
                        &#9654; Start
                    </button>
                    <button class="btn btn-danger btn-sm" id="btn-stop" onclick="window.__engine.stop()" style="display:none">
                        &#9632; Stop
                    </button>
                    <button class="btn btn-secondary btn-sm" id="btn-cycle" onclick="window.__engine.cycle()">
                        &#8635; Cycle
                    </button>
                    {% endif %}
                </div>

                <span class="header-clock" id="clock">IST --:--:--</span>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="app-content">
            <div class="content-inner" id="screen-container">
                <!-- Screens are rendered here by JS router -->
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- App JS (ES modules) -->
    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
